[project]
name = "route-assistant-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "eval-type-backport>=0.4,<1.0; python_version < '3.10'",
  "fastapi>=0.128,<1.0",
  "httpx>=0.28,<0.29",
  "openai>=2.45,<3.0",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.11,<3.0",
  "uvicorn>=0.39,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-nvidia-ai-endpoints==0.3.19",
  "langgraph>=0.6,<0.7",
  "langsmith>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
