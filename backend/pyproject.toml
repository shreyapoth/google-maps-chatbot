[project]
name = "route-assistant-backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "eval-type-backport; python_version < '3.10'",
  "fastapi",
  "httpx",
  "openai",
  "pydantic-settings",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
